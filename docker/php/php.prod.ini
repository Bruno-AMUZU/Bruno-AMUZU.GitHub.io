; Réglages PHP de production (ajoutés à php.ini-production).

; Aucune erreur affichée au visiteur : elles vont dans le journal (et storage/logs/ via ErrorHandler).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Ne pas annoncer la version de PHP.
expose_php = Off

; Fichiers envoyés depuis le back-office : 10 Mo par fichier (PDF), plusieurs par formulaire.
upload_max_filesize = 12M
post_max_size = 40M

; Sessions : cookie HTTPS uniquement, inaccessible au JavaScript, identifiants refusés s'ils sont inventés.
session.cookie_secure = On
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On

; OPcache : le code PHP compilé reste en mémoire. Le code ne change qu'au déploiement :
; inutile de vérifier les fichiers à chaque requête (un redémarrage d'Apache recharge tout).
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
